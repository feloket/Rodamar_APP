{# Campos de fecha y orden. Uso: {% include 'includes/filtro_fecha.html' with f=filtro_fecha orden=orden %} (ancho=N cambia las columnas) #}
<div class="col-6 col-md-{{ ancho|default:2 }}">
  <label for="f-anio" class="form-label small fw-bold mb-1">Año</label>
  <select id="f-anio" name="anio" class="form-select form-select-sm">
    <option value="">Todos</option>
    {% for a in f.anios %}<option value="{{ a }}" {% if f.anio == a %}selected{% endif %}>{{ a }}</option>{% endfor %}
  </select>
</div>
<div class="col-6 col-md-{{ ancho|default:2 }}">
  <label for="f-mes" class="form-label small fw-bold mb-1">Mes</label>
  <select id="f-mes" name="mes" class="form-select form-select-sm">
    <option value="">Todos</option>
    {% for numero, nombre in f.meses %}<option value="{{ numero }}" {% if f.mes == numero %}selected{% endif %}>{{ nombre }}</option>{% endfor %}
  </select>
</div>
<div class="col-6 col-md-{{ ancho|default:2 }}">
  <label for="f-dia" class="form-label small fw-bold mb-1">Día</label>
  <select id="f-dia" name="dia" class="form-select form-select-sm">
    <option value="">Todos</option>
    {% for d in f.dias %}<option value="{{ d }}" {% if f.dia == d %}selected{% endif %}>{{ d }}</option>{% endfor %}
  </select>
</div>
<div class="col-6 col-md-{{ ancho|default:2 }}">
  <label for="f-desde" class="form-label small fw-bold mb-1">Desde (hora)</label>
  <input type="time" id="f-desde" name="hora_desde" value="{{ f.hora_desde }}" class="form-control form-control-sm">
</div>
<div class="col-6 col-md-{{ ancho|default:2 }}">
  <label for="f-hasta" class="form-label small fw-bold mb-1">Hasta (hora)</label>
  <input type="time" id="f-hasta" name="hora_hasta" value="{{ f.hora_hasta }}" class="form-control form-control-sm">
</div>
<div class="col-6 col-md-{{ ancho|default:2 }}">
  <label for="f-orden" class="form-label small fw-bold mb-1">Orden</label>
  <select id="f-orden" name="orden" class="form-select form-select-sm">
    <option value="recientes" {% if orden != 'antiguos' %}selected{% endif %}>Más recientes</option>
    <option value="antiguos" {% if orden == 'antiguos' %}selected{% endif %}>Más antiguos</option>
  </select>
</div>
