{% extends 'base.html' %}
{% block title %}Acceso denegado - RODAMAR{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-7 col-lg-6 text-center">
    <div class="card shadow-sm border-0 rounded-4 p-5">
      <div class="display-4 mb-3" aria-hidden="true">⛔</div>
      <h1 class="h3 fw-bold">No tienes permiso para ver esta página</h1>
      <p class="text-body-secondary mb-4">
        {% if exception %}{{ exception }}{% else %}Tu rol ({{ rol_nombre }}) no tiene acceso a esta sección.{% endif %}
      </p>
      <a href="{% url 'home' %}" class="btn btn-primary">Volver al inicio</a>
    </div>
  </div>
</div>
{% endblock %}
